<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Chambre - Satureja path</title> 
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="images/favicon.ico" type="image/x-icon">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Fontdiner+Swanky&family=Jacquarda+Bastarda+9&family=Reenie+Beanie&family=Rubik:ital,wght@0,300..900;1,300..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=The+Girl+Next+Door&display=swap" rel="stylesheet">

<style>

    #menu-container {
      position: fixed; /* reste collé à gauche même si la scène est centrée */
      top: 1px;
      left: 1px;
      z-index: 999;
    }

        :root {
      --w: 1195px;   /* largeur fixe de la scène */
      --h: 672px;    /* hauteur fixe de la scène */
    }

    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff; 
      background-image: url(images/backgrounds/tapisseriechambre.webp);
      background-repeat: repeat;
      background-size: contain;
      color: #000000;
      display: grid;
      place-items: center;
      cursor: url(images/cursors/dragonfly.cur), pointer;
    }

    /* --- Scène fixe --- */
    .scene {
      position: relative;
      width: var(--w);
      height: var(--h);
      /* Ne PAS rendre responsive : on fige la taille et on centre */
      background: #111 center/100% 100% no-repeat;
      overflow: hidden; /* masque les débordements */
      /*box-shadow: 0 10px 40px rgba(0,0,0,.5);*/
      image-rendering: auto;
    }

    /* Remplacez l'URL ci-dessous par le PNG (ou JPG) de la pièce complète */
    .scene::before {
      content: "";
      position: absolute; inset: 0;
      background: url('images/maison/chambre/fond_chambre.jpg') center/100% 100% no-repeat;
      z-index: 1;
    }

    /* --- Objets superposés (webp transparents) --- */
    .objet {
      position: absolute;
      z-index: 3;
      pointer-events: auto;
      transition: filter .01s ease;
    }

    .objet:hover {
      /* Glow qui suit la transparence de l'image */
      filter: drop-shadow(0 0 15px rgb(225, 0, 255)); /* rgba(226, 241, 131, 0.95) */
      cursor: url(images/cursors/Hand.cur), pointer;
    }

    a.pink {
        color:blue;
    }

    a.pink:hover {
        color:magenta;
    }

</style>

<body>
    <!-- <div id="menu-container"></div> -->

    <main>
        <div class="scene">
          
        </div>
        <div class="mono center"><a href="entree.html" class="mono pink">
            retourner à l'entrée
        </a></div>
    </main>
</body>

</head>
</html>
