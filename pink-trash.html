<style>
    h1 {
        font-family: 'Flavors';
        font-size: 40pt;
        color:#111;
        text-shadow: 2px 2px #99ccee;
        margin-top: 20px;
    }

    p {
        font-family: 'Space Mono';
        margin-left: 0em;
        text-align: center;
    }

    /* .pt-cont {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
    }

    .pt-obj {
        display: flex;
        flex-direction: column;
    } */

    .main {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }
    
    .parent {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 8px;
        width: 900px;
        max-width: 100%;
        margin: 0 auto;
        box-sizing: border-box;
    }

    .div1 {
        grid-row: span 2 / span 2;
    }


    .div3 {
        grid-column-start: 2;
        grid-row-start: 2;
    }

    .div4 {
        grid-column-start: 3;
        grid-row-start: 1;
    }

    .div5 {
        grid-column-start: 3;
        grid-row-start: 2;
    }

    .div6 {
        grid-column-start: 4;
        grid-row-start: 1;
    }

    .div7 {
        grid-column-start: 4;
        margin-top: -50px;
    }
        
</style>

<body style="background-color: #dd44aa;">
    <div id="menu-container"></div>
    
    <main>
        <h1>Pink trash</h1>

        <div class="parent">
            <div class="div1">
                <img src="images/pink trash/papier (1).webp" style="height: 500px; width: auto;">
            </div>
            <div class="div2">
                <img src="images/pink trash/pinklady.webp" style="height: 160px; width: auto; margin-left:30px; margin-top: 50px;">
            </div>
            <div class="div3">
                <img src="images/pink trash/theplein.webp" style="height: 200px; width: auto;">
            </div>
            <div class="div4">
                <img src="images/pink trash/ricola1.webp" style="height: 200px; width: auto;">
            </div>
            <div class="div5">
                <img src="images/pink trash/ricola2.webp" style="height: 200px; width: auto;">
            </div>
            <div class="div6">
                <img src="images/pink trash/the.webp" style="height: 200px; width: auto;">
            </div>
            <div class="div7">
                <img src="images/pink trash/haribo (1).webp" style="height: 300px; width: auto;">

        </div>

        <a href="gallery.html#collections" style="display: flex; margin: auto; align-items: center; justify-content: center; font-family: 'Space Mono';"><- back to collections page</a>
